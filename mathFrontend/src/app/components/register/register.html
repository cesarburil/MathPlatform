<section class="mp-auth">
  <div>
    <p class="mp-kicker">Cadastro</p>
    <h1 class="mp-title" style="font-size: clamp(2.2rem, 5vw, 3.4rem);">Crie sua conta</h1>
    <p class="mp-lead">Um usuário, uma senha - depois você assina e libera o conteúdo.</p>

    <form
      [formGroup]="userForm"
      (submit)="register(); $event.preventDefault()"
      class="mp-form"
      style="margin-top: 2rem;"
    >
      <label class="mp-label" for="username">
        Nome de usuário
        <input class="mp-input" formControlName="username" id="username" type="text" autocomplete="username" required />
      </label>
      <label class="mp-label" for="password">
        Senha
        <input
          class="mp-input"
          formControlName="password"
          id="password"
          type="password"
          autocomplete="new-password"
          required
        />
      </label>
      <button type="submit" class="mp-btn">Registrar</button>
    </form>

    <p class="mp-muted" style="margin-top: 1.5rem;">
      Já tem conta?
      <a routerLink="/login" style="color: var(--mp-accent); font-weight: 700;">Entrar</a>
    </p>
  </div>

  <aside class="mp-auth-side" aria-hidden="true">
    <img
      src="https://images.unsplash.com/photo-1596495577886-d920f1fb7238?auto=format&fit=crop&w=1600&q=80"
      alt=""
    />
  </aside>
</section>
