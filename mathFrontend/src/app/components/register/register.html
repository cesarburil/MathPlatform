<div class="mp-auth">
  <div>
    <p class="mp-kicker">Conta</p>
    <h1 class="mp-title">Registre-se.</h1>
    <form [formGroup]="userForm" (submit)="register()" class="mp-form" style="margin-top: 2rem;">
      <div>
        <label class="mp-label" for="username">Usuário</label>
        <input class="mp-input" formControlName="username" id="username" name="username" type="text" autocomplete="username" required />
      </div>
      <div>
        <label class="mp-label" for="password">Senha</label>
        <input class="mp-input" formControlName="password" id="password" name="password" type="password" autocomplete="current-password" required />
      </div>
      <button type="submit" class="mp-btn">Criar conta</button>
    </form>
    <p style="margin-top: 1.75rem; font-size: 0.9rem;">
      Já tem acesso?
      <a routerLink="/login" class="mp-link">Entrar</a>
    </p>
  </div>
  <div class="mp-auth-panel">
    <p class="mp-title" style="font-size: 1.5rem; max-width: 16rem;">
      Um usuário. Um papel. Depois, o restante.
    </p>
  </div>
</div>
