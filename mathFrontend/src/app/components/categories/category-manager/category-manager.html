<section>
  <div class="mp-actions" style="margin-bottom: 1.5rem;">
    <a routerLink="/admin" class="mp-btn-ghost">Voltar</a>
  </div>
  <p class="mp-kicker">Admin</p>
  <h1 class="mp-title">Categorias</h1>

  <div class="mp-actions" style="margin: 1.75rem 0;">
    <button type="button" class="mp-btn" (click)="openForm(null)">Nova categoria</button>
  </div>

  @if (showForm()) {
  <form class="mp-form" (submit)="$event.preventDefault()">
    <div>
      <label class="mp-label" for="category-name">Título</label>
      <input id="category-name" class="mp-input" (input)="categoryName.set($any($event.target).value)" type="text"
        [value]="categoryName()" />
    </div>
    <div class="mp-actions">
      <button type="button" class="mp-btn" (click)="selectedCategory() ? update() : create()">
        {{ selectedCategory() ? 'Atualizar' : 'Adicionar' }}
      </button>
      @if (selectedCategory()) {
      <button type="button" class="mp-btn-danger" (click)="delete()">Excluir</button>
      }
      <button type="button" class="mp-btn-ghost" (click)="closeForm()">Fechar</button>
    </div>
  </form>
  }

  <table class="mp-table" style="margin-top: 2rem;">
    <thead>
      <tr>
        <th>ID</th>
        <th>Título</th>
        <th></th>
      </tr>
    </thead>
    <tbody>
      @for (category of categories(); track category.id) {
      <tr>
        <td>{{ category.id }}</td>
        <td>{{ category.title }}</td>
        <td>
          <button type="button" class="mp-btn-ghost" (click)="openForm(category); categoryName.set(category.title); categoryId.set(category.id)">Editar</button>
        </td>
      </tr>
      }
    </tbody>
  </table>
</section>
