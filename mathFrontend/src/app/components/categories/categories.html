<section>
  <p class="mp-kicker">Aulas</p>
  <h1 class="mp-title">Categorias</h1>
  <p class="mp-lead">Escolha um tema. Cada linha abre as aulas daquela categoria.</p>

  <div class="mp-index" style="margin-top: 2.5rem;">
    @for (category of categories(); track category.id; let i = $index) {
    <a class="mp-index-row" [routerLink]="['/lessons', category.id]">
      <span class="mp-index-num">{{ (i + 1).toString().padStart(2, '0') }}</span>
      <span class="mp-index-title">{{ category.title }}</span>
      <span class="mp-index-meta">abrir</span>
    </a>
    } @empty {
    <p class="mp-empty">Nenhuma categoria ainda.</p>
    }
  </div>
</section>
