<section>
  <div class="mp-page-head">
    <div>
      <p class="mp-kicker">Aulas</p>
      <h1 class="mp-title" style="font-size: clamp(2rem, 5vw, 3.2rem);">Escolha o tema</h1>
      <p class="mp-lead">Selecione um assunto para estudar</p>
    </div>
  </div>

  @if (categories()?.length) {
  <div class="mp-catalog">
    @for (category of categories(); track category.id) {
    <a class="mp-catalog-item" [routerLink]="['/lessons', category.id]">
      <div>
        <span class="mp-chip">#{{ category.id }}</span>
        <h3 style="margin-top: 0.85rem;">{{ category.title }}</h3>
      </div>
      <p>Ver aulas →</p>
    </a>
    }
  </div>
  } @else {
  <p class="mp-empty">Nenhuma categoria por aqui ainda.</p>
  }
</section>
