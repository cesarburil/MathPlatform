<section class="mp-auth">
  <div>
    <p class="mp-kicker">Acesso</p>
    <h1 class="mp-title" style="font-size: clamp(2.2rem, 5vw, 3.4rem);">Entre no MathPlatform</h1>
    <p class="mp-lead">Continue de onde parou - aulas, exercícios e fórum.</p>

    <form [formGroup]="userForm" (submit)="login(); $event.preventDefault()" class="mp-form" style="margin-top: 2rem;">
      <label class="mp-label" for="username">
        Nome de usuário
        <input class="mp-input" formControlName="username" id="username" type="text" autocomplete="username" required />
      </label>
      <label class="mp-label" for="password">
        Senha
        <input
          class="mp-input"
          formControlName="password"
          id="password"
          type="password"
          autocomplete="current-password"
          required
        />
      </label>
      <button type="submit" class="mp-btn">Entrar</button>
    </form>

    <p class="mp-muted" style="margin-top: 1.5rem;">
      Não tem conta?
      <a routerLink="/register" style="color: var(--mp-accent); font-weight: 700;">Registre-se</a>
    </p>
  </div>

  <aside class="mp-auth-side" aria-hidden="true">
    <img
      src="https://images.unsplash.com/photo-1509228468518-180dd4864904?auto=format&fit=crop&w=1600&q=80"
      alt=""
    />
  </aside>
</section>
