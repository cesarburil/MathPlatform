<div class="max-w-sm w-full lg:max-w-full lg:flex m-5" routerLink="/comments/{{comment()?.id}}">

  <div
    class="border border-gray-400 bg-white rounded p-4 flex flex-col justify-between leading-normal">
    <div class="mb-8">
      <div class="text-gray-900 font-bold text-xl mb-2">{{ comment()?.username }}</div>
      <p class="text-gray-700 text-base">{{ comment()?.title }}</p>
    </div>
    <div class="flex items-center">

      <img class="w-10 h-10 rounded-full mr-4"
        src="https://tailwindcss.com/plus-assets/img/logos/mark.svg?color=indigo&shade=600"
        alt="Avatar de {{ comment()?.username }}">
      <div class="text-sm">
        <p class="text-gray-900 leading-none">{{ comment()?.username }}</p>
        <p class="text-gray-600">{{comment()?.answers?.length || 0}} {{comment()?.answers?.length === 1 ? 'resposta' :
          'respostas'}}</p>
      </div>
    </div>
  </div>
</div>
