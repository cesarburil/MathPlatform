<a class="mp-thread" [routerLink]="['/comments', comment()?.id]">
  <p class="mp-exam-cat">{{ comment()?.answers?.length || 0 }}
    {{ comment()?.answers?.length === 1 ? 'resposta' : 'respostas' }}</p>
  <h2 class="mp-index-title">{{ comment()?.title }}</h2>
  <p style="margin: 0.4rem 0 0; font-size: 0.85rem;">{{ comment()?.username }}</p>
</a>
