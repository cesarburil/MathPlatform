<section>
  <div class="mp-actions" style="margin-bottom: 1.5rem;">
    <a routerLink="/comments" class="mp-btn-ghost">Voltar</a>
  </div>

  <app-comment [comment]="selectedComment()"></app-comment>

  <form class="mp-form" style="margin: 2rem 0;" (submit)="$event.preventDefault()">
    <div>
      <label class="mp-label" for="new-answer">Resposta</label>
      <input id="new-answer" [value]="newAnswerTitle()" (input)="newAnswerTitle.set($any($event.target).value)" class="mp-input" type="text" placeholder="Escreva">
    </div>
    <button type="button" (click)="addAnswer()" class="mp-btn">Responder</button>
  </form>

  @for (answer of selectedComment()?.answers; track answer.id) {
  <p class="mp-reply"><strong>{{ answer.username || 'Anônimo' }}</strong> {{ answer.title }}</p>
  }
</section>
