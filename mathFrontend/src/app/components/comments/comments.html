<section>
  <p class="mp-kicker">Fórum</p>
  <h1 class="mp-title">Comentários</h1>

  <form class="mp-form" style="margin: 2rem 0 2.5rem;" (submit)="$event.preventDefault()">
    <div>
      <label class="mp-label" for="new-comment">Novo tópico</label>
      <input id="new-comment" [value]="newCommentTitle()" (input)="newCommentTitle.set($any($event.target).value)" class="mp-input" type="text" placeholder="Título">
    </div>
    <button type="button" (click)="addComment()" class="mp-btn">Publicar</button>
  </form>

  @for (comment of comments(); track comment.id) {
  <app-comment [comment]="comment"></app-comment>
  } @empty {
  <p class="mp-empty">Nenhum comentário ainda.</p>
  }
</section>
