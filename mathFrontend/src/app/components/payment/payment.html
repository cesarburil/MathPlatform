
    <div class="w-full max-w-3xl mx-auto p-8 mt-20">
        <div class="bg-white dark:bg-gray-800 p-8 rounded-lg shadow-md border dark:border-gray-700">
            <h1 class="text-2xl font-bold text-gray-800 dark:text-white mb-4">Checkout</h1>

            
            <form [formGroup]="paymentForm">
                <h2 class="text-xl font-semibold text-gray-700 dark:text-white mb-2">Informações de Pagamento</h2>
                <div class="mt-4">
                    <label for="card_holder" class="block text-gray-700 dark:text-white mb-1">Nome</label>
                    <input formControlName="holder"  type="text" id="card_holder" class="w-full rounded-lg border py-2 px-3 dark:bg-gray-700 dark:text-white dark:border-none">
                </div>
                <div class="mt-4">
                    <label for="card_number" class="block text-gray-700 dark:text-white mb-1">Número do Cartão</label>
                    <input formControlName="number"  type="text" id="card_number" class="w-full rounded-lg border py-2 px-3 dark:bg-gray-700 dark:text-white dark:border-none">
                </div>

                <div class="grid grid-cols-3 gap-4 mt-4">
                    <div>
                        <label for="exp_month" class="block text-gray-700 dark:text-white mb-1">Mês</label>
                        <input formControlName="expMonth" type="text" id="exp_month" class="w-full rounded-lg border py-2 px-3 dark:bg-gray-700 dark:text-white dark:border-none">
                    </div>
                    <div>
                        <label for="exp_year" class="block text-gray-700 dark:text-white mb-1">Ano</label>
                        <input formControlName="expYear" type="text" id="exp_year" class="w-full rounded-lg border py-2 px-3 dark:bg-gray-700 dark:text-white dark:border-none">
                    </div>
                    <div>
                        <label for="cvv" class="block text-gray-700 dark:text-white mb-1">CVV</label>
                        <input formControlName="securityCode" type="text" id="cvv" class="w-full rounded-lg border py-2 px-3 dark:bg-gray-700 dark:text-white dark:border-none">
                    </div>
                </div>
              </form>

            <div class="mt-8 flex justify-end">
                <button [disabled]="!paymentForm.valid" (click)="pay()" class="bg-teal-500 text-white px-4 py-2 rounded-lg hover:bg-teal-700 dark:bg-teal-600 dark:text-white dark:hover:bg-teal-900">Comprar</button>
            </div>
        </div>
    </div>
