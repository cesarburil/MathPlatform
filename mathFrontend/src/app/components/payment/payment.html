<section>
  <div class="mp-page-head">
    <div>
      <p class="mp-kicker">Assinatura</p>
      <h1 class="mp-title" style="font-size: clamp(2rem, 5vw, 3.2rem);">Checkout</h1>
      <p class="mp-lead">1 mês de acesso · R$ 5,00 · pagamento seguro</p>
    </div>
  </div>

  <div class="mp-panel" style="max-width: 34rem;">
    <form [formGroup]="paymentForm" class="mp-form" style="width: 100%;">
      <label class="mp-label" for="card_holder">
        Nome no cartão
        <input class="mp-input" formControlName="holder" type="text" id="card_holder" />
      </label>
      <label class="mp-label" for="card_number">
        Número do cartão
        <input class="mp-input" formControlName="number" type="text" id="card_number" />
      </label>
      <div style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 0.75rem;">
        <label class="mp-label" for="exp_month">
          Mês
          <input class="mp-input" formControlName="expMonth" type="text" id="exp_month" />
        </label>
        <label class="mp-label" for="exp_year">
          Ano
          <input class="mp-input" formControlName="expYear" type="text" id="exp_year" />
        </label>
        <label class="mp-label" for="cvv">
          CVV
          <input class="mp-input" formControlName="securityCode" type="text" id="cvv" />
        </label>
      </div>
    </form>

    <div style="margin-top: 1.5rem;">
      <button type="button" class="mp-btn" [disabled]="!paymentForm.valid" (click)="pay()">
        Pagar R$ 5,00
      </button>
    </div>
  </div>
</section>
