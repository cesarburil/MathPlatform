<section class="mp-checkout">
  <div>
    <p class="mp-kicker">Pedido</p>
    <h1 class="mp-title">Checkout</h1>
    <p class="mp-lead">{{ duration }}. Cartão de crédito, em 1x. Os dados são criptografados no navegador.</p>

    <div class="mp-order">
      <div class="mp-order-row">
        <span>Plano</span>
        <strong>{{ duration }}</strong>
      </div>
      <div class="mp-order-row">
        <span>Total</span>
        <strong class="mp-order-total">{{ price }}</strong>
      </div>
    </div>

    <p class="mp-label" style="margin-top: 1.75rem;">Bandeiras</p>
    <div class="mp-brands">
      <span>Visa</span>
      <span>Mastercard</span>
      <span>Elo</span>
      <span>Amex</span>
    </div>
  </div>

  <form [formGroup]="paymentForm" class="mp-form mp-form-wide">
    <p class="mp-kicker">Pagamento</p>
    <div>
      <label class="mp-label" for="card_holder">Nome no cartão</label>
      <input formControlName="holder" type="text" id="card_holder" class="mp-input" autocomplete="cc-name">
    </div>
    <div>
      <label class="mp-label" for="card_number">Número</label>
      <input formControlName="number" type="text" id="card_number" class="mp-input" inputmode="numeric" autocomplete="cc-number">
    </div>
    <div class="mp-pay-row">
      <div>
        <label class="mp-label" for="exp_month">Mês</label>
        <input formControlName="expMonth" type="text" id="exp_month" class="mp-input" inputmode="numeric" autocomplete="cc-exp-month">
      </div>
      <div>
        <label class="mp-label" for="exp_year">Ano</label>
        <input formControlName="expYear" type="text" id="exp_year" class="mp-input" inputmode="numeric" autocomplete="cc-exp-year">
      </div>
      <div>
        <label class="mp-label" for="cvv">CVV</label>
        <input formControlName="securityCode" type="text" id="cvv" class="mp-input" inputmode="numeric" autocomplete="cc-csc">
      </div>
    </div>
    <div class="mp-actions">
      <button type="button" [disabled]="!paymentForm.valid" (click)="pay()" class="mp-btn">Pagar {{ price }}</button>
    </div>
  </form>
</section>
