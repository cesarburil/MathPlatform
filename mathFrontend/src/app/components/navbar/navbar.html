<nav class="mp-nav" aria-label="Principal">
  <a routerLink="/home" class="mp-brand">
    <span class="mp-brand-mark" aria-hidden="true"></span>
    MathPlatform
  </a>

  @if (login.loggedIn()) {
  <div class="mp-nav-links">
    <app-navbar-item name="Aulas" path="/categories"></app-navbar-item>
    <app-navbar-item name="Exercícios" path="/questions"></app-navbar-item>
    <app-navbar-item name="Fórum" path="/comments"></app-navbar-item>
    @if (!login.hasPremium()) {
    <app-navbar-item name="Assinar" path="/pay"></app-navbar-item>
    }
  </div>
  <div class="mp-nav-end">
    <button type="button" class="mp-theme" (click)="theme.toggle()">
      {{ theme.isDark() ? 'Tema claro' : 'Tema escuro' }}
    </button>
    <button type="button" class="mp-nav-exit" (click)="logout()">Sair</button>
  </div>
  } @else {
  <div class="mp-nav-links">
    <app-navbar-item name="Início" path="/home"></app-navbar-item>
    <app-navbar-item name="Sobre" path="/about"></app-navbar-item>
  </div>
  <div class="mp-nav-end">
    <button type="button" class="mp-theme" (click)="theme.toggle()">
      {{ theme.isDark() ? 'Tema claro' : 'Tema escuro' }}
    </button>
    <a routerLink="/login" class="mp-nav-exit">Entrar</a>
  </div>
  }
</nav>
