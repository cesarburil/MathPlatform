<nav class="mp-nav" aria-label="Principal">
  <a routerLink="/home" class="mp-brand">
    <span class="mp-brand-mark" aria-hidden="true"></span>
    MathPlatform
  </a>

  <div class="mp-nav-links">
    <app-navbar-item name="Início" path="/home" icon="home"></app-navbar-item>
    <app-navbar-item name="Sobre" path="/about" icon="about"></app-navbar-item>
    <app-navbar-item name="Aulas" path="/categories" icon="lessons"></app-navbar-item>
    <app-navbar-item name="Exercícios" path="/questions" icon="questions"></app-navbar-item>
    <app-navbar-item name="Fórum" path="/comments" icon="forum"></app-navbar-item>
    @if (login.loggedIn()) {
    <app-navbar-item name="Assinar" path="/pay" icon="pay"></app-navbar-item>
    }
  </div>

  <div class="mp-nav-end">
    <button type="button" class="mp-btn-ghost" (click)="theme.toggle()">
      {{ theme.isDark() ? 'Tema claro' : 'Tema escuro' }}
    </button>
    @if (login.loggedIn()) {
    <button type="button" class="mp-btn-ghost" (click)="logout()">Sair</button>
    } @else {
    <a routerLink="/login" class="mp-btn">Entrar</a>
    }
  </div>
</nav>
