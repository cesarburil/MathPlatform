<a [routerLink]="path()" routerLinkActive="active" class="mp-nav-link">
  <span class="mp-nav-icon" aria-hidden="true">
    @switch (icon()) {
      @case ('home') {
        <svg viewBox="0 0 16 16" fill="none">
          <path d="M2.5 7.2 L8 2.5 L13.5 7.2 V13.2 H9.2 V9.4 H6.8 V13.2 H2.5 Z" class="mp-nav-stroke" />
        </svg>
      }
      @case ('about') {
        <svg viewBox="0 0 16 16" fill="none">
          <circle cx="8" cy="8" r="5.5" class="mp-nav-stroke" />
          <path d="M8 7.2 V11.2" class="mp-nav-stroke" stroke-linecap="round" />
          <circle cx="8" cy="5.2" r="0.7" class="mp-nav-dot" />
        </svg>
      }
      @case ('lessons') {
        <svg viewBox="0 0 16 16" fill="none">
          <circle cx="8" cy="8" r="5.5" class="mp-nav-stroke" />
          <path d="M6.8 5.8 L10.6 8 L6.8 10.2 Z" class="mp-nav-dot" />
        </svg>
      }
      @case ('questions') {
        <svg viewBox="0 0 16 16" fill="none">
          <circle cx="4" cy="4.5" r="1.6" class="mp-nav-stroke" />
          <path d="M6.5 4.5 H13" class="mp-nav-stroke" stroke-linecap="round" />
          <circle cx="4" cy="8" r="1.6" class="mp-nav-stroke" />
          <circle cx="4" cy="8" r="0.55" class="mp-nav-dot" />
          <path d="M6.5 8 H12" class="mp-nav-stroke" stroke-linecap="round" />
          <circle cx="4" cy="11.5" r="1.6" class="mp-nav-stroke" />
          <path d="M6.5 11.5 H11" class="mp-nav-stroke" stroke-linecap="round" />
        </svg>
      }
      @case ('forum') {
        <svg viewBox="0 0 16 16" fill="none">
          <circle cx="5" cy="5" r="2" class="mp-nav-stroke" />
          <path d="M8 4.2 H12.5" class="mp-nav-stroke" stroke-linecap="round" />
          <path d="M8 6 H11" class="mp-nav-stroke" stroke-linecap="round" />
          <path d="M3.5 9.5 H12.5" class="mp-nav-stroke" stroke-linecap="round" />
          <path d="M3.5 12 H10.5" class="mp-nav-stroke" stroke-linecap="round" />
        </svg>
      }
      @case ('pay') {
        <svg viewBox="0 0 16 16" fill="none">
          <rect x="2.2" y="4.2" width="11.6" height="7.6" rx="1.2" class="mp-nav-stroke" />
          <path d="M2.2 7 H13.8" class="mp-nav-stroke" />
          <path d="M5 10.2 H8.2" class="mp-nav-stroke" stroke-linecap="round" />
        </svg>
      }
    }
  </span>
  <span>{{ name() }}</span>
</a>
