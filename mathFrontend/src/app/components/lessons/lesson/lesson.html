<section>
  <div class="mp-page-head">
    <div>
      <p class="mp-kicker">{{ lesson()?.categoryName || 'Aula' }}</p>
      <h1 class="mp-title" style="font-size: clamp(1.8rem, 4vw, 2.8rem);">
        {{ lesson()?.title || 'Carregando…' }}
      </h1>
      <p class="mp-lead">{{ lesson()?.description }}</p>
    </div>
    <a class="mp-btn-ghost" [routerLink]="['/lessons', lesson()?.categoryId]">Voltar</a>
  </div>

  @if (lesson()?.video) {
  <div class="mp-panel" style="aspect-ratio: 16 / 9; padding: 0; overflow: hidden;">
    <iframe
      [src]="safeVideo()"
      title="Videoaula"
      style="width: 100%; height: 100%; border: 0;"
      allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
      allowfullscreen
    ></iframe>
  </div>
  } @else if (lesson()) {
  <p class="mp-empty">Esta aula ainda não tem vídeo vinculado.</p>
  }
</section>
