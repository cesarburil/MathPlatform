<button class="bg-blue-500 text-white p-2 rounded-md mb-2" (click)="openForm(null)">{{
    selectedLesson() ? 'Atualizar' : 'Adicionar' }}</button>
@if (showForm()) {
<form class="form flex flex-col gap-2">
    <input class="border border-gray-300 p-2 rounded-md" (input)="lessonTitle.set($event.target.value)" type="text"
        [value]="lessonTitle()" />

    <div class="actions flex gap-2 mb-2">
        <button class="bg-blue-500 text-white p-2 rounded-md" (click)="selectedLesson() ? update() : create()">{{
            selectedLesson() ? 'Atualizar' : 'Adicionar' }}</button>
        @if (selectedLesson()) {
            <button class="bg-red-500 text-white p-2 rounded-md" (click)="delete(lessonId())">Excluir</button>
        }
        <button class="bg-gray-500 text-white p-2 rounded-md" (click)="closeForm()">Fechar</button>
    </div>
</form>
}

<table class="table-auto">
    <thead class="bg-gray-200">
        <tr>
            <th class="px-4 py-2">ID</th>
            <th class="px-4 py-2">Título</th>
            <th class="px-4 py-2">Categoria</th>    
            <th class="px-4 py-2">Ações</th>
        </tr>
    </thead>
    @for (lesson of lessons(); track lesson.id) {
    <tr class="hover:bg-gray-100">
        <td class="px-4 py-2">{{ lesson.id }}</td>
        <td class="px-4 py-2">{{ lesson.title }}</td>
        <td class="px-4 py-2">{{ lesson.categoryId }}</td>
        <td class="px-4 py-2">
            <button class="bg-blue-500 text-white p-2 rounded-md" (click)="openForm(lesson)">Editar</button>
        </td>
    </tr>
}
</table>
