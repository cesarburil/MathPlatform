<section>
  <div class="mp-actions" style="margin-bottom: 1.5rem;">
    <a routerLink="/admin" class="mp-btn-ghost">Voltar</a>
  </div>
  <p class="mp-kicker">Admin</p>
  <h1 class="mp-title">Aulas</h1>

  <div class="mp-actions" style="margin: 1.75rem 0;">
    <button type="button" class="mp-btn" (click)="openForm(null)">Nova aula</button>
  </div>

  @if (showForm()) {
  <form class="mp-form" (submit)="$event.preventDefault()">
    <div>
      <label class="mp-label" for="lesson-title">Título</label>
      <input id="lesson-title" class="mp-input" (input)="lessonTitle.set($any($event.target).value)" type="text"
        [value]="lessonTitle()" />
    </div>
    <div>
      <label class="mp-label" for="lesson-category">Categoria</label>
      <select id="lesson-category" class="mp-select"
        (change)="selectedCategory.set(categories().find((c) => c.id === +$any($event.target).value) ?? null)">
        <option [value]="0">Escolher</option>
        @for (category of categories(); track category.id) {
        <option [value]="category.id" [selected]="selectedCategory()?.id === category.id">{{ category.title }}</option>
        }
      </select>
    </div>
    <div class="mp-actions">
      <button type="button" class="mp-btn" (click)="selectedLesson() ? update() : create()">
        {{ selectedLesson() ? 'Atualizar' : 'Adicionar' }}
      </button>
      @if (selectedLesson()) {
      <button type="button" class="mp-btn-danger" (click)="delete(lessonId())">Excluir</button>
      }
      <button type="button" class="mp-btn-ghost" (click)="closeForm()">Fechar</button>
    </div>
  </form>
  }

  <table class="mp-table" style="margin-top: 2rem;">
    <thead>
      <tr>
        <th>ID</th>
        <th>Título</th>
        <th>Categoria</th>
        <th></th>
      </tr>
    </thead>
    <tbody>
      @for (lesson of lessons(); track lesson.id) {
      <tr>
        <td>{{ lesson.id }}</td>
        <td>{{ lesson.title }}</td>
        <td>{{ lesson.categoryId }}</td>
        <td>
          <button type="button" class="mp-btn-ghost" (click)="openForm(lesson)">Editar</button>
        </td>
      </tr>
      }
    </tbody>
  </table>
</section>
