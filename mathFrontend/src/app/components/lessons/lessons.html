<section>
  <div class="mp-actions" style="margin-bottom: 2rem;">
    <a routerLink="/categories" class="mp-btn-ghost">Voltar</a>
  </div>
  <p class="mp-kicker">Categoria</p>
  <h1 class="mp-title">Aulas</h1>

  <div class="mp-index" style="margin-top: 2.5rem;">
    @for (lesson of lessons(); track lesson.id; let i = $index) {
    <a class="mp-index-row" [routerLink]="['/watch', lesson.id]">
      <span class="mp-index-num">{{ (i + 1).toString().padStart(2, '0') }}</span>
      <span>
        <span class="mp-index-title">{{ lesson.title }}</span>
        <p style="margin: 0.35rem 0 0; font-size: 0.95rem;">{{ lesson.description }}</p>
      </span>
      <span class="mp-index-meta">{{ lesson.categoryName }}</span>
    </a>
    } @empty {
    <p class="mp-empty">Não há aulas aqui.</p>
    }
  </div>
</section>
