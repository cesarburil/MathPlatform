@for (lesson of lessons(); track $index) {
<div class="max-w-sm w-full lg:max-w-full lg:flex cursor-pointer m-5" routerLink="/watch/{{lesson.id}}">
  <div
    class="h-48 lg:h-auto lg:w-48 flex-none bg-cover rounded-t lg:rounded-t-none lg:rounded-l text-center overflow-hidden"
    style="background-image: url('https://v1.tailwindcss.com/img/card-top.jpg')" title="">
  </div>
  <div
    class="border-r border-b border-l border-gray-400 lg:border-l-0 lg:border-t lg:border-gray-400 bg-white rounded-b lg:rounded-b-none lg:rounded-r p-4 flex flex-col justify-between leading-normal">
    <div class="mb-8">
      <p class="text-sm text-gray-600 flex items-center">
        {{lesson.categoryName}}
      </p>
      <div class="text-gray-900 font-bold text-xl mb-2">
        {{lesson.title}}</div>
      <p class="text-gray-700 text-base">{{lesson.description}}</p>
    </div>
    <div class="flex items-center">

      <img class="w-10 h-10 rounded-full mr-4"
        src="https://tailwindcss.com/plus-assets/img/logos/mark.svg?color=indigo&shade=600" alt="">
      <div class="text-sm">
        <p class="text-gray-900 leading-none">MathPlatform</p>
        <p class="text-gray-600">Agosto 2026</p>
      </div>
    </div>
  </div>
</div>
}

@empty {
<div class="text-center flex flex-col justify-center gap-4">
  <p>Não há aulas aqui.</p>
  <div>
    <button routerLink="/categories" class="bg-blue-500 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded">
      Voltar
    </button>
  </div>
</div>

}
