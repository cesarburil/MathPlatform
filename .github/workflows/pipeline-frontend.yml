name: Frontend Pipeline
on:
  push:
    branches:
      - ci/pipeline
    paths:
      - mathFrontend/**
      - .github/workflows/*-frontend.yml
      - docker/frontend/**
      - 'docker-compose.yml'

jobs:
  build-image:
    runs-on: ubuntu-latest
    name: Build Docker Image

    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Extract Project Version
        id: extract_version
        run: |
          cd mathFrontend
          VERSION=$(node -p "require('./package.json').version")
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT

      - name: Build Docker Image
        run: |
          cd mathFrontend
          docker build -t math-frontend .


      - name: Login to DockerHub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build & Push to DockerHub
        uses: docker/build-push-action@v5
        with:
          context: ./mathFrontend
          file: docker/frontend/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/math-frontend:${{ steps.extract_version.outputs.PROJECT_VERSION }},
                ${{ secrets.DOCKERHUB_USERNAME }}/math-frontend:latest
          build-args: |
            PROFILE=dev
            APP_VERSION=${{ steps.extract_version.outputs.PROJECT_VERSION }}

  deploy:
    runs-on: ubuntu-latest
    name: Deploy frontend to Docker Compose
    needs: [build-image]
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Copy docker-compose.yml to VPS
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: "docker-compose.yml"
          target: "ci-cd"

      - name: Set ENV variables and deploy
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd ci-cd
            docker-compose -f docker-compose.yml pull
            docker-compose -f docker-compose.yml up -d