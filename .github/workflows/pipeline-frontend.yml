name: Frontend Pipeline
on:
  push:
    branches:
      - ci/pipeline
    paths:
      - mathFrontend/**
      - .github/workflows/*-frontend.yml
      - docker/frontend/**
      - 'docker-compose.yml'

jobs:
  build-image:
    runs-on: ubuntu-latest
    name: Build Docker Image

    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Extract the Project Version
        id: extract_version
        run: |
          cd mathFrontend
          VERSION=$(node -p "require('./package.json').version")
          echo "PROJECT_VERSION=$VERSION" >> $GITHUB_OUTPUT

      - name: Login to DockerHub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build & Push to DockerHub
        uses: docker/build-push-action@v5
        with:
          context: ./mathFrontend
          file: docker/frontend/Dockerfile
          push: true
          platforms: linux/amd64
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/math-frontend:${{ steps.extract_version.outputs.PROJECT_VERSION }}
            ${{ secrets.DOCKERHUB_USERNAME }}/math-frontend:latest
          build-args: |
            PROFILE=dev
            APP_VERSION=${{ steps.extract_version.outputs.PROJECT_VERSION }}

  deploy:
    runs-on: ubuntu-latest
    name: Deploy frontend to Docker Compose
    needs: [build-image]
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Create .env from secrets
        env:
          POSTGRES_URL: ${{ secrets.POSTGRES_URL }}
          POSTGRES_USERNAME: ${{ secrets.POSTGRES_USERNAME }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          PAGBANK_TOKEN: ${{ secrets.PAGBANK_TOKEN }}
          SITE_URL: ${{ secrets.SITE_URL }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          umask 077
          printf '%s\n' \
            "POSTGRES_URL=${POSTGRES_URL}" \
            "POSTGRES_USERNAME=${POSTGRES_USERNAME}" \
            "POSTGRES_PASSWORD=${POSTGRES_PASSWORD}" \
            "PAGBANK_TOKEN=${PAGBANK_TOKEN}" \
            "SITE_URL=${SITE_URL}" \
            "DOCKERHUB_USERNAME=${DOCKERHUB_USERNAME}" > .env

      - name: Copy docker-compose.yml and .env to VPS
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: "docker-compose.yml,.env"
          target: "ci-cd"

      - name: Deploy frontend containers
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd ci-cd
            # choose available docker compose command
            if docker --version >/dev/null 2>&1 && docker compose version >/dev/null 2>&1; then
              CMD="docker compose"
            elif command -v docker-compose >/dev/null 2>&1; then
              CMD="docker-compose"
            else
              echo "docker compose not found on remote. Attempting install via apt-get..."
              if command -v apt-get >/dev/null 2>&1; then
                sudo apt-get update && sudo apt-get install -y docker-compose || true
              fi
              if command -v docker-compose >/dev/null 2>&1; then
                CMD="docker-compose"
              else
                echo "docker compose is not available on the remote host. Aborting."
                exit 1
              fi
            fi
            # Compose auto-loads ./.env for variable substitution
            $CMD -f docker-compose.yml pull
            $CMD -f docker-compose.yml up -d