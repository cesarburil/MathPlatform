name: Backend Pipeline

on:
  push:
    branches:
      - ci/pipeline
    paths:
      - mathBackend/**
      - .github/workflows/*-backend.yml
      - docker/backend/**
      - 'docker-compose.yml'

jobs:
  compile:
    runs-on: ubuntu-latest
    name: Compile and Build Docker Image

    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Set up JDK
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Compile Java code
        run: |
          cd mathBackend
          ./mvnw clean compile

  unit-tests:
    runs-on: ubuntu-latest
    name: Run Unit Tests
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Run Unit Tests
        run: |
          cd mathBackend
          ./mvnw test -Dspring.profiles.active=test

  build:
    runs-on: ubuntu-latest
    name: Build backend spring
    needs: [compile, unit-tests]
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Build backend spring
        run: |
          cd mathBackend
          ./mvnw clean package -DskipTests

  build-image:
    runs-on: ubuntu-latest
    name: Build Docker Image
    needs: [compile, unit-tests, build]
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Setup Jdk 21
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Extract project version from pom.xml
        id: extract_version
        run: |
          cd mathBackend
          VERSION=$(./mvnw help:evaluate -Dexpression=project.version -q -DforceStdout)
          echo "PROJECT_VERSION=$VERSION" >> $GITHUB_OUTPUT

      - name: Login to DockerHub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build & Push to DockerHub
        uses: docker/build-push-action@v5
        with:
          context: ./mathBackend
          file: docker/backend/Dockerfile
          push: true
          platforms: linux/amd64
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/math-backend:${{ steps.extract_version.outputs.PROJECT_VERSION }}
            ${{ secrets.DOCKERHUB_USERNAME }}/math-backend:latest
          build-args: |
            PROFILE=dev
            APP_VERSION=${{ steps.extract_version.outputs.PROJECT_VERSION }}

  deploy:
    runs-on: ubuntu-latest
    name: Deploy to Docker Compose
    needs: [build-image]
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Create .env from secrets
        env:
          POSTGRES_URL: ${{ secrets.POSTGRES_URL }}
          POSTGRES_USERNAME: ${{ secrets.POSTGRES_USERNAME }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          PAGBANK_TOKEN: ${{ secrets.PAGBANK_TOKEN }}
          SITE_URL: ${{ secrets.SITE_URL }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          umask 077
          printf '%s\n' \
            "POSTGRES_URL=${POSTGRES_URL}" \
            "POSTGRES_USERNAME=${POSTGRES_USERNAME}" \
            "POSTGRES_PASSWORD=${POSTGRES_PASSWORD}" \
            "PAGBANK_TOKEN=${PAGBANK_TOKEN}" \
            "SITE_URL=${SITE_URL}" \
            "DOCKERHUB_USERNAME=${DOCKERHUB_USERNAME}" > .env

      - name: Copy docker-compose.yml and .env to VPS
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: "docker-compose.yml,.env"
          target: "ci-cd"

      - name: Deploy backend containers
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd ci-cd
            # choose available docker compose command on remote
            if docker --version >/dev/null 2>&1 && docker compose version >/dev/null 2>&1; then
              CMD="docker compose"
            elif command -v docker-compose >/dev/null 2>&1; then
              CMD="docker-compose"
            else
              echo "docker compose not found on remote. Attempting install via apt-get..."
              if command -v apt-get >/dev/null 2>&1; then
                sudo apt-get update && sudo apt-get install -y docker-compose || true
              fi
              if command -v docker-compose >/dev/null 2>&1; then
                CMD="docker-compose"
              else
                echo "docker compose is not available on the remote host. Aborting."
                exit 1
              fi
            fi
            # Compose auto-loads ./.env for variable substitution
            $CMD -f docker-compose.yml pull
            $CMD -f docker-compose.yml up -d